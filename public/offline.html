<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#00695c" />
<title>MyCogniverse – pas de connexion</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6f8f8; color: #17302e;
         display: grid; place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  main { max-width: 22rem; text-align: center; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0; color: #00695c; }
  p { margin: 0; line-height: 1.5; }
  button { margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 6px; background: #00695c;
           color: #fff; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Pas de connexion</h1>
  <p>MyCogniverse a besoin d'Internet pour émarger ou écrire un compte-rendu. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
